[project]
name = "hospital-assistant-fase3"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain>=0.1.16",
    "langchain-community>=0.0.34",
    "langgraph>=0.0.40",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.6.0",
    "streamlit>=1.32.0",
    "huggingface_hub>=0.22.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "groq>=0.4.0",
    "google-generativeai>=0.8.0,<1.0.0",
    "pandas>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "grandalf>=0.7.0",
]

[project.optional-dependencies]
# GPU-only training deps. NOT installed in the devcontainer/Docker image —
# fine-tuning runs on Google Colab (see notebooks/finetuning_colab.ipynb),
# which installs these itself. Kept here so `uv sync --extra finetuning`
# works if someone wants a matching local env anyway.
finetuning = [
    "bitsandbytes>=0.43.0",
    "trl>=0.8.0",
    "accelerate>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_assistant"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hospital_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.20",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
]
